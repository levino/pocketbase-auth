# Production overlay of this site. Argo CD (Application `pocketbase-auth` in
# levino/server-config) reads THIS directory — from the branch `production`,
# which the deploy job writes after every build: main's tree plus the pinned
# image tag(s) below. Humans never push to `production`.
#
# No image to pin: pods run public node images and clone the branch
# `production-dist` (auth/ + app/) at start; the pin is the annotation
# `levinkeller.de/dist-commit` in workloads.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pocketbase-auth
resources:
  - workloads.yaml
  - ingress.yaml
  - sealed-app-env.yaml
  - sealed-auth-env.yaml
