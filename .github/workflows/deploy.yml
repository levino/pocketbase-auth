name: Deploy

# Push to main -> build the image(s) on a native ARM runner -> push :<sha> to
# GHCR -> pin deploy/overlays/production to that tag -> publish "main's tree +
# pin" to the branch `production`. Argo CD on the cluster tracks `production`.
# CI never talks to the cluster; the cluster pulls with its GitHub App.
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: ghcr.io/levino/pocketbase-auth-auth
            context: ./docker
            dockerfile: Dockerfile
          - image: ghcr.io/levino/pocketbase-auth-app
            context: ./example-app
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          # Immutable tag only. `latest` would let a node run something that
          # git cannot name.
          tags: ${{ matrix.image }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Install kustomize
        run: curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | sudo tar xz -C /usr/local/bin
      - name: Pin the overlay to the freshly built :<sha>
        working-directory: deploy/overlays/production
        run: |
          kustomize edit set image ghcr.io/levino/pocketbase-auth-auth=ghcr.io/levino/pocketbase-auth-auth:${{ github.sha }}
          kustomize edit set image ghcr.io/levino/pocketbase-auth-app=ghcr.io/levino/pocketbase-auth-app:${{ github.sha }}
      - name: Publish the pinned overlay to the GitOps branch `production`
        run: |
          git config user.name  "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add deploy/overlays/production/kustomization.yaml
          git commit -m "chore(deploy): roll to ${{ github.sha }}"
          git push --force origin HEAD:refs/heads/production
