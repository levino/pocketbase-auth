name: Deploy

# Push to main -> build the auth layer and the example app -> publish both as
# the orphan branch `production-dist` (auth/, app/) -> pin
# deploy/overlays/production to that commit -> publish "main's tree + pin" to
# the branch `production`. Argo CD tracks `production`; the pods clone
# `production-dist` at start and run it on a public node image.
#
# No container image, no registry: the cluster may only use the GitHub App,
# and GHCR does not let an App installation read private packages. Git it can.
on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the auth layer (astro, node adapter standalone)
        working-directory: docker
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm prune --omit=dev
      - name: Assemble production-dist (auth/ + app/)
        run: |
          mkdir -p dist/auth dist/app
          cp -r docker/dist docker/node_modules docker/package.json dist/auth/
          cp example-app/server.mjs example-app/package.json dist/app/
      - name: Publish it as the orphan branch `production-dist`
        id: dist
        working-directory: dist
        run: |
          echo "${{ github.sha }}" > .dist-commit
          git init -q -b production-dist
          git config user.name  "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add -A -f
          git commit -q -m "dist for ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:refs/heads/production-dist
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pin the overlay to that dist commit and publish it to `production`
        run: |
          sed -i "s|levinkeller.de/dist-commit: \".*\"|levinkeller.de/dist-commit: \"${{ steps.dist.outputs.sha }}\"|g" deploy/overlays/production/workloads.yaml
          grep -q "${{ steps.dist.outputs.sha }}" deploy/overlays/production/workloads.yaml
          git config user.name  "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add deploy/overlays/production/workloads.yaml
          git commit -q -m "chore(deploy): roll to dist ${{ steps.dist.outputs.sha }} (source ${{ github.sha }})"
          git push --force origin HEAD:refs/heads/production
